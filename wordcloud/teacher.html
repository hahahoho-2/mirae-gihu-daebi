<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>워드클라우드 교사 화면</title>
<style>
  :root { --bg:#0F172A; --panel:#1E293B; --line:#334155; --ink:#F8FAFC; --sub:#AAB7C8; --main:#FB923C; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  button { font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:9px 12px; cursor:pointer; }
  button:hover { border-color:var(--main); }
  button.main { background:#C2410C; border-color:#C2410C; font-weight:700; }
  input { font:inherit; width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:#0B1222; color:var(--ink); }

  #start { max-width:640px; margin:0 auto; padding:12vh 24px; }
  #start h1 { font-size:34px; margin:0 0 10px; }
  #start p { color:var(--sub); line-height:1.7; word-break:keep-all; }
  #start label { display:block; font-weight:700; margin:22px 0 8px; }
  #start .btns { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }

  #live { height:100%; display:grid; grid-template-columns:1fr 268px; grid-template-rows:auto 1fr; }
  #live.noDock { grid-template-columns:1fr; }
  #live.noDock #dock { display:none; }
  #question { grid-column:1; padding:18px 28px 6px; font-size:clamp(20px,2.4vw,32px); font-weight:800; word-break:keep-all; }
  #stage { grid-column:1; position:relative; overflow:hidden; min-height:0; }
  #dock { grid-column:2; grid-row:1 / span 2; background:var(--panel); border-left:1px solid var(--line); padding:16px; display:flex; flex-direction:column; gap:10px; overflow:auto; }
  #qr { background:#fff; border-radius:12px; padding:10px; line-height:0; }
  #qr svg { width:100%; height:auto; display:block; }
  #roomCode { text-align:center; font-size:26px; font-weight:800; letter-spacing:.08em; }
  #stats { text-align:center; color:var(--sub); font-size:15px; }
  #net { text-align:center; color:#FCA5A5; font-size:13px; min-height:18px; }
  #dock .tools { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:auto; }
  #dock .tools button { font-size:14px; padding:8px 6px; }
  #showDock { position:absolute; right:12px; top:12px; display:none; font-size:14px; opacity:.75; }
  #live.noDock #showDock { display:block; }

  .word { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); white-space:nowrap; font-weight:800; line-height:1.1; transition:left .7s ease, top .7s ease, font-size .7s ease, opacity .5s ease; }
  .word.new { opacity:0; }
  #empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--sub); font-size:clamp(20px,2.6vw,34px); text-align:center; padding:24px; word-break:keep-all; }

  #manage { position:fixed; inset:0; background:rgba(2,6,23,.6); display:none; align-items:center; justify-content:center; padding:20px; z-index:10; }
  #manage.on { display:flex; }
  #manageBox { width:min(620px,100%); max-height:82vh; overflow:auto; background:var(--panel); border-radius:14px; padding:20px; }
  #manageBox h2 { margin:0 0 4px; font-size:22px; }
  #manageBox h3 { margin:20px 0 8px; font-size:16px; color:var(--sub); }
  .line { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
  .line span { flex:1; word-break:break-all; }
  .line b { color:var(--main); min-width:34px; text-align:right; }
  button.danger { background:#B91C1C; border-color:#B91C1C; font-weight:700; }
  #ask { position:fixed; inset:0; background:rgba(2,6,23,.72); display:none; align-items:center; justify-content:center; padding:20px; z-index:20; }
  #ask.on { display:flex; }
  #askBox { width:min(480px,100%); background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px; }
  #askBox h2 { margin:0 0 8px; font-size:21px; word-break:keep-all; }
  #askBox p { margin:0 0 14px; color:var(--sub); line-height:1.6; word-break:keep-all; }
  #askBox .btns { display:flex; justify-content:flex-end; gap:10px; margin-top:16px; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); max-width:min(560px,90vw); background:#F8FAFC; color:#0F172A; font-weight:700; padding:12px 18px; border-radius:10px; z-index:30; display:none; word-break:keep-all; text-align:center; }
  #toast.on { display:block; }
  @media (max-width:860px) { #live { grid-template-columns:1fr; grid-template-rows:auto 1fr auto; } #dock { grid-column:1; grid-row:3; border-left:0; border-top:1px solid var(--line); flex-direction:row; flex-wrap:wrap; align-items:center; } #qr { width:120px; } #dock .tools { margin-top:0; flex:1; } }
</style>
</head>
<body>

<section id="start" hidden>
  <h1>실시간 워드클라우드</h1>
  <p>학생이 QR로 접속해 적은 생각이 이 화면에 바로 모입니다. 같은 생각이 많을수록 글자가 커지고 가운데로 옵니다. 로그인이나 비밀번호는 필요 없습니다.</p>
  <label for="newQ">학생에게 보여 줄 질문</label>
  <input id="newQ" maxlength="80" value="무엇이 우리의 옷·밥·집을 바꿨을까? 한 단어로!">
  <div class="btns">
    <button class="main" id="create">활동 시작</button>
    <button id="resume" hidden>이전 활동 이어서</button>
  </div>
  <p id="startMsg" role="status"></p>
</section>

<section id="live" hidden>
  <div id="question"></div>
  <div id="stage">
    <div id="empty">학생들의 생각을 기다리고 있어요</div>
    <button id="showDock">QR·메뉴 보기</button>
  </div>
  <aside id="dock">
    <div id="qr" aria-label="학생 접속 QR 코드"></div>
    <div id="roomCode"></div>
    <div id="stats" aria-live="polite">참여 0명 · 의견 0개</div>
    <div id="net" role="status"></div>
    <div class="tools">
      <button id="toggleOpen">입력 잠그기</button>
      <button id="openManage">의견 관리</button>
      <button id="editQ">질문 바꾸기</button>
      <button id="clear">전체 지우기</button>
      <button id="full">전체 화면</button>
      <button id="hideDock">QR 숨기기</button>
      <button id="finish" style="grid-column:1 / span 2">활동 끝내기(기록 삭제)</button>
    </div>
  </aside>
</section>

<div id="manage" role="dialog" aria-modal="true" aria-label="의견 관리">
  <div id="manageBox">
    <h2>의견 관리</h2>
    <h3>화면에 보이는 의견</h3><div id="shownList"></div>
    <h3>숨긴 의견</h3><div id="hiddenList"></div>
    <div style="margin-top:16px"><button id="closeManage">닫기</button></div>
  </div>
</div>

<div id="ask" role="alertdialog" aria-modal="true" aria-labelledby="askTitle" aria-describedby="askBody">
  <div id="askBox">
    <h2 id="askTitle"></h2>
    <p id="askBody"></p>
    <input id="askInput" maxlength="80" aria-label="새 질문" hidden>
    <div class="btns"><button id="askCancel">취소</button><button id="askOk"></button></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="qrcode.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const RAINBOW = ['#FF5C5C', '#FF9A3D', '#FFE14A', '#4ADE80', '#38BDF8', '#818CF8', '#D67BFF'];
  const FONT = '"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif';
  const STORE = 'wc_teacher';

  let session = null;   // { code, secret }
  let last = null;      // 마지막 집계
  let lastSig = '';
  let timer = null;
  const colorOf = new Map();
  const spans = new Map();
  const measure = document.createElement('canvas').getContext('2d');

  const load = () => { try { return JSON.parse(localStorage.getItem(STORE)); } catch (e) { return null; } };
  const save = (v) => { try { v ? localStorage.setItem(STORE, JSON.stringify(v)) : localStorage.removeItem(STORE); } catch (e) { /* 저장 불가: 새로고침 전까지만 유지 */ } };

  function assignColors(items) {
    [...items].sort((a, b) => a.f - b.f).forEach((it) => {
      if (!colorOf.has(it.k)) colorOf.set(it.k, colorOf.size % RAINBOW.length);
    });
  }

  // 큰 글자부터 가운데에서 나선형으로 빈자리를 찾는다.
  function place(items, W, H, scale) {
    const max = items[0].n;
    const base = Math.min(W, H);
    const big = Math.min(Math.max(base * 0.24, 54), 190) * scale;
    const small = Math.min(Math.max(base * 0.06, 24), 46) * scale;
    const boxes = [], out = [];
    const hit = (b) => boxes.some((o) => b.x < o.x + o.w && b.x + b.w > o.x && b.y < o.y + o.h && b.y + b.h > o.y);
    for (const it of items) {
      let size = max === 1 ? small * 1.5 : small + (big - small) * Math.sqrt((it.n - 1) / (max - 1));
      measure.font = `800 ${size}px ${FONT}`;
      let w = measure.measureText(it.t).width;
      if (w > W * 0.92) { size *= (W * 0.92) / w; w = W * 0.92; }
      const h = size * 1.12, pad = Math.max(6, size * 0.1);
      let done = false;
      for (let t = 0; t < 900 && !done; t += 0.22) {
        const r = t * Math.max(5, base * 0.012);
        const cx = W / 2 + r * Math.cos(t) * (W / H > 1 ? Math.min(W / H, 2) : 1);
        const cy = H / 2 + r * Math.sin(t);
        const b = { x: cx - w / 2 - pad, y: cy - h / 2 - pad, w: w + pad * 2, h: h + pad * 2 };
        if (b.x < 0 || b.y < 0 || b.x + b.w > W || b.y + b.h > H || hit(b)) continue;
        boxes.push(b); out.push({ it, x: cx, y: cy, size }); done = true;
      }
      if (!done) return null;
    }
    return out;
  }

  function draw() {
    const items = last ? last.items : [];
    $('empty').hidden = items.length > 0;
    $('empty').style.display = items.length ? 'none' : 'flex';
    const stage = $('stage'), W = stage.clientWidth, H = stage.clientHeight;
    if (!W || !H) return;
    assignColors(items);
    let spots = [];
    if (items.length) {
      for (const s of [1, .9, .8, .7, .6, .5, .42, .35, .28, .22]) { spots = place(items, W, H, s); if (spots) break; }
      spots = spots || [];
    }
    const keep = new Set();
    for (const { it, x, y, size } of spots) {
      keep.add(it.k);
      let el = spans.get(it.k);
      const fresh = !el;
      if (fresh) {
        el = document.createElement('div'); el.className = 'word new';
        el.style.color = RAINBOW[colorOf.get(it.k)];
        el.style.left = `${x}px`; el.style.top = `${y}px`; el.style.fontSize = `${size * 0.7}px`;
        stage.append(el); spans.set(it.k, el);
        el.getBoundingClientRect();
      }
      el.textContent = it.t;
      el.title = `${it.n}명`;
      el.classList.remove('new');
      el.style.left = `${x}px`; el.style.top = `${y}px`; el.style.fontSize = `${size}px`;
      el.style.zIndex = String(it.n);
    }
    for (const [k, el] of spans) {
      if (!keep.has(k)) { el.classList.add('new'); setTimeout(() => el.remove(), 500); spans.delete(k); }
    }
  }

  async function poll() {
    if (!session) return;
    try {
      const d = await wcRpc('wc_list', { p_code: session.code });
      $('net').textContent = '';
      if (!d) { save(null); location.reload(); return; }
      last = d;
      $('question').textContent = d.question;
      $('stats').textContent = `참여 ${d.participants}명 · 의견 ${d.total}개`;
      $('toggleOpen').textContent = d.is_open ? '입력 잠그기' : '입력 열기';
      const sig = JSON.stringify(d.items.map((i) => [i.k, i.n, i.t]));
      if (sig !== lastSig) { lastSig = sig; draw(); if ($('manage').classList.contains('on')) renderManage(); }
    } catch (e) {
      $('net').textContent = '연결 확인 중…';
    }
  }

  function goLive() {
    $('start').hidden = true; $('live').hidden = false;
    const url = new URL(`index.html?r=${session.code}`, location.href).href;
    const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
    $('qr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
    $('roomCode').textContent = session.code.replace(/(\d{3})(\d{3})/, '$1 $2');
    poll(); clearInterval(timer); timer = setInterval(poll, 1500);
  }

  async function createRoom() {
    const q = $('newQ').value.trim();
    if (!q) { $('startMsg').textContent = '질문을 적어 주세요.'; return; }
    $('create').disabled = true;
    try {
      const r = await wcRpc('wc_create_room', { p_question: q });
      if (!r.ok) { $('startMsg').textContent = '지금은 활동을 만들 수 없어요. 잠시 뒤 다시 눌러 주세요.'; return; }
      session = { code: r.code, secret: r.secret }; save(session); goLive();
    } catch (e) {
      $('startMsg').textContent = '서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.';
    } finally { $('create').disabled = false; }
  }

  let toastTimer = null;
  function toast(text) {
    $('toast').textContent = text; $('toast').classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.remove('on'), 4500);
  }

  // 일부 브라우저 창은 confirm·prompt를 띄우지 않고 바로 취소하므로 페이지 안에서 직접 묻는다.
  function ask({ title, body = '', ok, danger = false, value = null }) {
    return new Promise((resolve) => {
      const input = $('askInput');
      $('askTitle').textContent = title; $('askBody').textContent = body; $('askOk').textContent = ok;
      $('askOk').className = danger ? 'danger' : 'main';
      input.hidden = value === null; input.value = value ?? '';
      const done = (v) => { $('ask').classList.remove('on'); document.removeEventListener('keydown', key); resolve(v); };
      const key = (e) => {
        if (e.key === 'Escape') done(null);
        if (e.key === 'Enter' && value !== null && !e.isComposing) done(input.value);
      };
      $('askOk').onclick = () => done(value === null ? true : input.value);
      $('askCancel').onclick = () => done(null);
      document.addEventListener('keydown', key);
      $('ask').classList.add('on');
      (value === null ? $('askCancel') : input).focus();
    });
  }

  // 교사 기능 호출. 서버가 거절하거나 연결이 끊기면 이유를 화면에 알린다.
  async function act(name, body = {}) {
    try {
      if (await wcRpc(name, { p_code: session.code, p_secret: session.secret, ...body })) return true;
      toast('이 브라우저에는 이 활동의 관리 권한이 없어요. 활동을 처음 만든 브라우저에서 눌러 주세요.');
    } catch (e) {
      toast('연결이 불안정해요. 잠시 뒤 다시 눌러 주세요.');
    }
    return false;
  }

  async function renderManage() {
    const rows = (list, label, hide) => {
      const box = document.createElement('div');
      if (!list.length) { box.textContent = '없음'; box.style.color = 'var(--sub)'; return box; }
      list.forEach((it) => {
        const line = document.createElement('div'); line.className = 'line';
        const t = document.createElement('span'); t.textContent = it.t;
        const n = document.createElement('b'); n.textContent = `${it.n}명`;
        const b = document.createElement('button'); b.textContent = label;
        b.onclick = async () => {
          if (await act('wc_set_hidden', { p_key: it.k, p_hidden: hide })) { await poll(); renderManage(); }
        };
        line.append(t, n, b); box.append(line);
      });
      return box;
    };
    const hidden = (await wcRpc('wc_hidden', { p_code: session.code, p_secret: session.secret })) || [];
    $('shownList').replaceChildren(rows(last ? last.items : [], '숨기기', true));
    $('hiddenList').replaceChildren(rows(hidden, '되돌리기', false));
  }

  $('create').onclick = createRoom;
  $('resume').onclick = () => { session = load(); goLive(); };
  $('openManage').onclick = () => { $('manage').classList.add('on'); renderManage(); };
  $('closeManage').onclick = () => $('manage').classList.remove('on');
  $('toggleOpen').onclick = async () => {
    if (await act('wc_set_room', { p_question: last.question, p_open: !last.is_open })) poll();
  };
  $('editQ').onclick = async () => {
    const q = await ask({ title: '질문 바꾸기', body: '학생 화면의 질문도 함께 바뀝니다.', ok: '바꾸기', value: last ? last.question : '' });
    if (q && q.trim() && await act('wc_set_room', { p_question: q.trim(), p_open: last.is_open })) { poll(); toast('질문을 바꿨어요.'); }
  };
  $('clear').onclick = async () => {
    const yes = await ask({ title: '의견을 모두 지울까요?', body: '지금까지 모인 의견이 삭제되고 되돌릴 수 없습니다. 활동과 QR은 그대로 쓸 수 있습니다.', ok: '전체 지우기', danger: true });
    if (yes && await act('wc_clear')) { colorOf.clear(); poll(); toast('의견을 모두 지웠어요.'); }
  };
  $('finish').onclick = async () => {
    const fixed = last && last.is_fixed;
    const body = fixed
      ? '모인 의견이 서버에서 모두 삭제되고 되돌릴 수 없습니다. PPT의 QR은 다음 수업에도 그대로 쓸 수 있습니다.'
      : '이 활동의 질문과 의견이 서버에서 모두 삭제되고 되돌릴 수 없습니다. QR도 더 이상 쓸 수 없습니다.';
    const yes = await ask({ title: '활동을 끝낼까요?', body, ok: '끝내고 삭제', danger: true });
    if (!yes || !await act('wc_delete_room')) return;
    if (fixed) { colorOf.clear(); poll(); toast('의견을 모두 지웠어요. QR은 다음 수업에도 쓸 수 있어요.'); }
    else { save(null); location.reload(); }
  };
  $('full').onclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
  $('hideDock').onclick = () => { $('live').classList.add('noDock'); requestAnimationFrame(draw); };
  $('showDock').onclick = () => { $('live').classList.remove('noDock'); requestAnimationFrame(draw); };
  new ResizeObserver(() => draw()).observe($('stage'));

  // PPT의 교사 링크(teacher.html?r=방번호#k=관리코드)로 열면 그 방으로 바로 들어간다. 관리 코드는 주소창에 남기지 않는다.
  const saved = load();
  const linkCode = new URLSearchParams(location.search).get('r');
  const linkKey = new URLSearchParams(location.hash.slice(1)).get('k');
  if (linkCode && linkKey) {
    session = { code: linkCode, secret: linkKey }; save(session);
    history.replaceState(null, '', location.search);
    goLive();
  } else if (linkCode && saved && saved.code === linkCode) {
    session = saved; goLive();
  } else {
    if (saved && saved.code) $('resume').hidden = false;
    $('start').hidden = false;
  }
</script>
</body>
</html>
